services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stocklynx
      POSTGRES_PASSWORD: stocklynx
      POSTGRES_DB: stocklynx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocklynx"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  typesense:
    image: typesense/typesense:27.1
    volumes:
      - typesensedata:/data
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-stocklynx-typesense-key}
      TYPESENSE_DATA_DIR: /data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8108'"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    command: flask run --host=0.0.0.0 --port=5000
    env_file: .env
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql://stocklynx:stocklynx@db:5432/stocklynx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-14B}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-stocklynx-typesense-key}
    ports:
      - "9401:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build: .
    env_file: .env
    entrypoint: []
    command: celery -A celery_worker.celery worker --pool=prefork --concurrency=10 -Q celery --loglevel=info
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql://stocklynx:stocklynx@db:5432/stocklynx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-14B}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-stocklynx-typesense-key}
    depends_on:
      api:
        condition: service_started
      typesense:
        condition: service_healthy
    restart: unless-stopped

  celery-backfill:
    build: .
    env_file: .env
    entrypoint: []
    command: celery -A celery_worker.celery worker --pool=prefork --concurrency=20 -Q backfill --loglevel=info
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql://stocklynx:stocklynx@db:5432/stocklynx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-14B}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-stocklynx-typesense-key}
    depends_on:
      api:
        condition: service_started
      typesense:
        condition: service_healthy
    restart: unless-stopped

  celery-user:
    build: .
    env_file: .env
    entrypoint: []
    command: celery -A celery_worker.celery worker --pool=prefork --concurrency=5 -Q user --loglevel=info
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql://stocklynx:stocklynx@db:5432/stocklynx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-14B}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-stocklynx-typesense-key}
    depends_on:
      api:
        condition: service_started
      typesense:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: .
    env_file: .env
    entrypoint: []
    command: celery -A celery_worker.celery beat --loglevel=info
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql://stocklynx:stocklynx@db:5432/stocklynx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /tickerlinks/api
        VITE_BASE: /tickerlinks/
    ports:
      - "9400:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  typesensedata:

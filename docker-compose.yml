services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stocklynx
      POSTGRES_PASSWORD: stocklynx
      POSTGRES_DB: stocklynx
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocklynx"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9410:9000"
      - "9411:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: flask run --host=0.0.0.0 --port=5000
    env_file: .env
    environment:
      FLASK_APP: app
      FLASK_DEBUG: "1"
      DATABASE_URL: postgresql://stocklynx:stocklynx@db:5432/stocklynx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-14B}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-stocklynx-typesense-key}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-tickerbets-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
    ports:
      - "5001:5000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker:
    build: .
    env_file: .env
    command: celery -A celery_worker.celery worker --pool=prefork --concurrency=10 -Q celery --loglevel=info
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql://stocklynx:stocklynx@db:5432/stocklynx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-14B-Instruct}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-stocklynx-typesense-key}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-tickerbets-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started
      typesense:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-backfill:
    build: .
    env_file: .env
    command: celery -A celery_worker.celery worker --pool=prefork --concurrency=20 -Q backfill --loglevel=info
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql://stocklynx:stocklynx@db:5432/stocklynx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-14B-Instruct}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-stocklynx-typesense-key}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-tickerbets-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started
      typesense:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-user:
    build: .
    env_file: .env
    command: celery -A celery_worker.celery worker --pool=prefork --concurrency=5 -Q user --loglevel=info
    environment:
      FLASK_APP: app
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-14B}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-stocklynx-typesense-key}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-tickerbets-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started
      typesense:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A celery_worker.celery beat --loglevel=info
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql://stocklynx:stocklynx@db:5432/stocklynx
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-tickerbets-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_healthy

  typesense:
    image: typesense/typesense:27.1
    ports:
      - "8108:8108"
    volumes:
      - typesensedata:/data
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-stocklynx-typesense-key}
      TYPESENSE_DATA_DIR: /data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8108'"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  typesensedata:
  miniodata:
